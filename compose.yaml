services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: quiz-builder-backend:latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CORS_ORIGIN=http://localhost:3000
      - DATABASE_URL=file:/data/prod.db
    volumes:
      - backend-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const req = require('http').request('http://localhost:4000/health', {timeout: 3000}, (res) => { if (res.statusCode !== 200) process.exit(1); req.destroy(); process.exit(0); }); req.on('error', () => process.exit(1)); req.on('timeout', () => { req.destroy(); process.exit(1); }); req.end();"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: quiz-builder-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_URL=http://backend:4000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data: